; ============================================================
;  ESP32 WinKeyer — PlatformIO
;  WinKeyer (K1EL WK3 protocol) clone on ESP32-S3 — native USB CDC + WiFi TCP bridge, iambic paddle keying, sidetone, speed pot
;
;  Flash:  ./flash.sh            (build + upload; picks the serial port)
;          ./monitor.sh          (serial monitor; picks the port)
;  upload_port / monitor_port are deliberately NOT pinned — see flash.sh.
; ============================================================

[platformio]
default_envs = esp32-winkeyer

[common]
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_src_filter = -<*> +<main.cpp> +<keyer.cpp> +<winkeyer.cpp> +<flex.cpp> +<net.cpp>
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; Classic ESP32 devkit (CP2102) — current shack board (ESP32-D0WD-V3).
; No native USB: wired fallback is UART via the CP2102.
[env:esp32-winkeyer]
platform      = espressif32
board         = esp32dev
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
build_src_filter = ${common.build_src_filter}
lib_deps      = ${common.lib_deps}

; ESP32-S3 — future upgrade path: native USB CDC with a custom descriptor
; (unique serial number, "VU2CPL WinKeyer" product string).
[env:esp32s3-winkeyer]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed  = ${common.upload_speed}
build_src_filter = ${common.build_src_filter}
lib_deps      = ${common.lib_deps}
build_flags   =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
